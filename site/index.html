<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; upgrade-insecure-requests">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <title>TopBinz × Krillion Leaderboard</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <div class="page">
    <header class="masthead">
      <p class="eyebrow">Friends leaderboard</p>
      <h1 id="title">TopBinz <span class="x">×</span> Krillion</h1>
    </header>

    <div class="controls">
      <nav class="tabs" role="tablist" aria-label="Leaderboards" id="tabs"></nav>
      <div class="period" role="group" aria-label="Time period" id="period"></div>
    </div>

    <main id="view" aria-live="polite">
      <p class="loading">Loading scores…</p>
    </main>

    <footer class="footer">
      <p class="add">
        <a class="button" id="paste-link" rel="noopener noreferrer" target="_blank">＋ Paste a result</a>
        <a id="add-link" rel="noopener noreferrer" target="_blank">or type scores</a>
      </p>
      <p id="updated" class="muted"></p>
    </footer>
  </div>
</body>
</html>
